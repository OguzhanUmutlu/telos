[workspace]
resolver = "3"
members = [
    "crates/vx-core",
    "crates/vx-gpu",
    "crates/vx-voxel",
    "crates/vx-mesh",
    "crates/vx-assets",
    "crates/vx-worldgen",
    "crates/vx-storage",
    "crates/vx-protocol",
    "crates/vx-net",
    "crates/vx-server",
    "crates/vx-lod",
    "crates/vx-ui",
    "crates/vx-sim",
    "apps/voxel-server",
    "apps/voxel",
    "apps/voxel-web",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Larvance"]
repository = "https://github.com/larvance/voxel"

[workspace.dependencies]
# Internal crates
vx-core = { version = "0.1.0", path = "crates/vx-core" }
vx-gpu = { version = "0.1.0", path = "crates/vx-gpu" }
vx-voxel = { version = "0.1.0", path = "crates/vx-voxel" }
vx-mesh = { version = "0.1.0", path = "crates/vx-mesh" }
vx-assets = { version = "0.1.0", path = "crates/vx-assets" }
vx-worldgen = { version = "0.1.0", path = "crates/vx-worldgen" }
vx-storage = { version = "0.1.0", path = "crates/vx-storage" }
vx-protocol = { version = "0.1.0", path = "crates/vx-protocol" }
vx-net = { version = "0.1.0", path = "crates/vx-net" }
vx-server = { version = "0.1.0", path = "crates/vx-server" }
vx-lod = { version = "0.1.0", path = "crates/vx-lod" }
vx-ui = { version = "0.1.0", path = "crates/vx-ui" }
vx-sim = { version = "0.1.0", path = "crates/vx-sim" }

# ECS & Gameplay
bevy_ecs = { version = "0.15", default-features = false }

# UI & Layout
taffy = "0.14"
slotmap = "1.0"

# Assets & image decoding
image = { version = "0.25", default-features = false, features = ["png"] }

# Graphics & windowing (Vulkan 1.3)
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }

# Math & primitives
glam = { version = "0.29", default-features = false, features = ["std"] }
bytemuck = { version = "1.25", features = ["derive"] }

# Data structures & concurrency
bitflags = "2.8"
arc-swap = "1.7"
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }

# Logging & telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tracing-tracy = { version = "0.11" }

# Error handling & CLI
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

# Allocator & OS
mimalloc = { version = "0.1", default-features = false }
ctrlc = { version = "3.4", features = ["termination"] }

# Testing & benches
proptest = "1.6"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
crc32fast = "1.4"
tempfile = "3.17"

# Storage & compression
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", default-features = false }
lz4_flex = { version = "0.11", default-features = false }

# Networking & Async
tokio = { version = "1.43", default-features = false, features = ["sync", "rt", "net", "time", "macros"] }
bytes = "1.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

# Web & WASM (apps/voxel-web)
wasm-bindgen = "0.2.129"
js-sys = "0.3.70"
web-sys = "0.3.70"
console_error_panic_hook = "0.1.7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
