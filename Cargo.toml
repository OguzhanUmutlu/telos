[workspace]
resolver = "3"
members = [
    "crates/telos-core",
    "crates/telos-gpu",
    "crates/telos-voxel",
    "crates/telos-mesh",
    "crates/telos-assets",
    "crates/telos-worldgen",
    "crates/telos-storage",
    "crates/telos-protocol",
    "crates/telos-net",
    "crates/telos-content",
    "crates/telos-server",
    "crates/telos-lod",
    "crates/telos-ui",
    "crates/telos-sim",
    "crates/telos-mod",
    "crates/telos-audio",
    "apps/telos-server",
    "apps/telos",
    "apps/telos-web",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Larvance"]
repository = "https://github.com/larvance/telos"

[workspace.dependencies]
# Internal crates
telos-core = { version = "0.1.0", path = "crates/telos-core" }
telos-gpu = { version = "0.1.0", path = "crates/telos-gpu" }
telos-voxel = { version = "0.1.0", path = "crates/telos-voxel" }
telos-content = { version = "0.1.0", path = "crates/telos-content" }
telos-mesh = { version = "0.1.0", path = "crates/telos-mesh" }
telos-assets = { version = "0.1.0", path = "crates/telos-assets" }
telos-worldgen = { version = "0.1.0", path = "crates/telos-worldgen" }
telos-storage = { version = "0.1.0", path = "crates/telos-storage" }
telos-protocol = { version = "0.1.0", path = "crates/telos-protocol" }
telos-net = { version = "0.1.0", path = "crates/telos-net" }
telos-server = { version = "0.1.0", path = "crates/telos-server" }
telos-lod = { version = "0.1.0", path = "crates/telos-lod" }
telos-ui = { version = "0.1.0", path = "crates/telos-ui" }
telos-sim = { version = "0.1.0", path = "crates/telos-sim" }
telos-mod = { version = "0.1.0", path = "crates/telos-mod" }
telos-audio = { version = "0.1.0", path = "crates/telos-audio" }

# Audio & spatial sound
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis", "wav"] }

# ECS & Gameplay
bevy_ecs = { version = "0.15", default-features = false }

# UI & Layout
taffy = "0.14"
slotmap = "1.0"

# Assets & image decoding
image = { version = "0.25", default-features = false, features = ["png"] }

# Graphics & windowing (Vulkan 1.3)
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }

# Math & primitives
glam = { version = "0.29", default-features = false, features = ["std"] }
bytemuck = { version = "1.25", features = ["derive"] }

# Data structures & concurrency
bitflags = "2.8"
arc-swap = "1.7"
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }

# Logging & telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tracing-tracy = { version = "0.11" }

# Error handling & CLI
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

# Allocator & OS
mimalloc = { version = "0.1", default-features = false }
ctrlc = { version = "3.4", features = ["termination"] }
dirs = "6.0"

# Testing & benches
proptest = "1.6"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
crc32fast = "1.4"
tempfile = "3.17"

# Storage & compression
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", default-features = false }
lz4_flex = { version = "0.11", default-features = false }

# Modding, data formats & hashing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }
blake3 = "1.6"
wasmtime = { version = "30", default-features = false, features = ["runtime", "cranelift", "component-model", "wat", "std"] }
rquickjs = { version = "0.14", default-features = false, features = ["std"] }

# Networking & Async
tokio = { version = "1.43", default-features = false, features = ["sync", "rt", "rt-multi-thread", "net", "time", "macros", "io-util"] }
bytes = "1.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

# Web & WASM (apps/voxel-web)
wasm-bindgen = "0.2.129"
js-sys = "0.3.70"
web-sys = "0.3.70"
console_error_panic_hook = "0.1.7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"

